<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Transformation</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">

    <div class="hero">
      <img class="hero-logo" src="imege/takumi.png" alt="高岡工場 匠 TAKUMI ロゴ">
      <div class="hero-text">
        <h1>Digital Transformation</h1>
        <span class="subtitle">気合を入れて作った基礎課題</span>
      </div>
      <video class="hero-logo hero-video" autoplay muted loop>
        <source src="imege/60thRAV4.mp4" type="video/mp4">
        高岡工場 60周年demo
      </video>
    </div>

    <p class="lead">DXは、デジタル技術を使って、仕事のやり方や価値を変えていくことです。</p>

    <ul class="anniversary-list">
      <li>高岡工場60th Anniversary</li>
    </ul>

    <div class="button-area">
      <button id="digitizationButton">デジタイゼーション</button>
      <button id="digitalizationButton">デジタライゼーション</button>
      <button id="dxButton">DX</button>
    </div>

    <div class="card">
      <h2 id="title">ボタンを押してください</h2>
      <p id="description">3つの言葉の違いを、順番に確認できます。</p>
    </div>

    <div class="example-box">
      <h3>身近な例</h3>
      <p id="example">例もここに表示されます。</p>
    </div>

    <ol class="step-area">
      <li>データにする：紙や手書きの情報をデータにする</li>
      <li>仕事を便利にする：データを使って集計や確認を早くする</li>
      <li>価値を変える：データから気づきを得て改善につなげる</li>
    </ol>

    <div class="badge-section">
      <h3>DX人材にはいろいろな役割がある</h3>
      <div class="badge-area">
        <img src="imege/IMG_6872.PNG" alt="Digital Value Creator Basic">
        <img src="imege/IMG_6871.PNG" alt="Digital Value Creator Skill">
        <img src="imege/IMG_6870.PNG" alt="Business Architect Beginner">
        <img src="imege/IMG_7614.PNG" alt="Data Scientist Beginner">
        <img src="imege/IMG_7615.PNG" alt="Software Engineer Beginner">
        <img src="imege/IMG_7616.PNG" alt="Designer Beginner">
      </div>
    </div>

    <div class="footer-note">FND47 01_Shinji_Tsunoda</div>

  </div>
</body>
</html>
